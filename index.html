<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Nawigacyjne</title>
    <style>
        /* Reset podstawowych styli */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Styl paska nawigacji */
        .navbar {
            background-color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Styl logo */
        .logo a {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Lista linków (menu) */
        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        /* Pojedynczy link */
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        /* Efekt po najechaniu myszką */
        .nav-links a:hover {
            color: #3498db;
        }

        /* Ukryty przycisk hamburgera dla urządzeń mobilnych */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
        }

        .menu-toggle span {
            background-color: #ffffff;
            height: 3px;
            width: 25px;
            border-radius: 2px;
        }

        /* Style dla ekranów mobilnych (smartfony) */
        @media (max-width: 768px) {
            .nav-links {
                display: none; /* Ukryte domyślnie na telefonie */
                flex-direction: column;
                width: 100%;
                position: absolute;
                top: 60px;
                left: 0;
                background-color: #2c3e50;
                padding: 20px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }

            .nav-links.active {
                display: flex; /* Pokazuje menu po kliknięciu */
            }

            .menu-toggle {
                display: flex; /* Pokazuje hamburgera na telefonie */
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="#">MojaStrona</a>
        </div>
        
        <!-- Przycisk menu dla telefonów -->
        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Linki nawigacyjne -->
        <ul class="nav-links" id="nav-list">
            <li><a href="#home">Strona Główna</a></li>
            <li><a href="#o-nas">O nas</a></li>
            <li><a href="#uslugi">Usługi</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#kontakt">Kontakt</a></li>
        </ul>
    </nav>

    <script>
        // Skrypt obsługujący otwieranie menu na telefonie
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.getElementById('nav-list');

        mobileMenu.addEventListener('click', () => {
            navList.classList.toggle('active');
        });
    </script>

</body>
</html>
